<z-card class="w-full">
  <div data-slot="card-content" class="flex flex-col">
    <div class="flex items-center justify-between">
      <div class="flex flex-col">
        <span class="text-muted-foreground text-sm">{{ data().title }}</span>
        <span class="text-foreground text-2xl font-bold"
          >{{ data().metric }}</span
        >
      </div>
      <div class="bg-primary/10 rounded-full p-3">
        <z-icon [zType]="data().icon" class="text-primary size-5"></z-icon>
      </div>
    </div>
    @if (data().description) {
    <span class="text-muted-foreground text-xs">{{ data().description }}</span>
    }
  </div>
</z-card>
