<app-main-layout #layout>
  <div class="flex flex-col space-y-4">
    <app-main-header (toggled)="layout.toggleSidebar()" />
    <div class="flex flex-col gap-y-4">
      <div class="flex flex-col gap-4 lg:flex-row">
        @for (tile of tiles(); track tile.title) {
        <app-tile [data]="tile" />
        }
      </div>
      <div class="flex flex-col gap-4 lg:flex-row">
        <app-recent-boards />
        <app-oldest-tasks />
      </div>
    </div>
  </div>
</app-main-layout>
