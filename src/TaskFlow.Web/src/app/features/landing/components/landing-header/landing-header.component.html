<header class="absolute top-0 right-0 left-0 z-20 px-4 py-4 md:py-5">
  <div class="mx-auto flex max-w-7xl items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div
        class="flex size-8 items-center justify-center rounded-lg border border-rose-500/30 bg-zinc-900"
      >
        <z-icon zType="house" zSize="xl" class="font-black text-rose-400" />
      </div>
      <span class="text-lg font-bold text-white">{{ appName }}</span>
    </div>
    <div class="flex items-center gap-2.5">
      <button
        z-button
        zSize="lg"
        zType="outline"
        class="cursor-pointer"
        (click)="login()"
      >
        {{ 'log-in' | withPrefix: prefix() | translate }}
      </button>
    </div>
  </div>
</header>
