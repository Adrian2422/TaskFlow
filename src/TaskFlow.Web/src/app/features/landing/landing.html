<main class="h-screen">
  <app-landing-header />
  <section
    class="relative flex min-h-screen items-center justify-center overflow-hidden bg-linear-to-br from-zinc-950 via-rose-950 to-zinc-900"
  >
    <div class="relative z-10 mx-auto max-w-4xl px-4 pt-20 pb-12 text-center">
      <h1
        class="mb-6 text-4xl leading-[1.1] font-extrabold tracking-tight md:text-6xl lg:text-7xl"
      >
        <span class="text-white">
          {{ 'hero.title1' | withPrefix:prefix() | translate }}
        </span>
        <br />
        <span class="text-white">
          {{ 'hero.title2' | withPrefix:prefix() | translate }}
        </span>
      </h1>
      <p
        class="mx-auto mb-12 max-w-2xl text-lg leading-relaxed text-zinc-300 md:text-xl"
      >
        {{ 'hero.subtitle' | withPrefix:prefix() | translate }}
      </p>
      <div class="flex flex-col justify-center gap-4 sm:flex-row">
        <button
          z-button
          zSize="lg"
          class="animate-glow-pulse cursor-pointer bg-rose-600 text-white hover:bg-rose-500 focus:bg-rose-500"
          (click)="goToRegistration()"
        >
          {{ 'sign-up' | withPrefix:prefix() | translate }}
        </button>
        <button z-button zSize="lg" zType="outline" class="cursor-pointer">
          {{ 'how-it-works' | withPrefix:prefix() | translate }}
        </button>
      </div>
    </div>
  </section>
</main>
